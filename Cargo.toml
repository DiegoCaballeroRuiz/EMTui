[package]
name = "emtui"
version = "0.2.2"
edition = "2024"
description = "A terminal user interface for buses operated by EMT-Madrid"
license = "MIT"

[dependencies]
dirs = "6.0.0"
reqwest = {version = "0.13.4", features = ["blocking", "json"]}
serde_json = "1.0.150"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
# indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
